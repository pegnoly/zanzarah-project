[package]
name = "editor"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "editor_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }
cynic-codegen = { version = "3.13.2"}

[dependencies]
tauri = { version = "2.11.2", features = [] }
tauri-plugin-shell = "2.3.5"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = {version = "1.0.150", features = ["raw_value"] }
binary-reader = "0.4.5"
encoding_rs = "0.8.35"
uuid = { version = "1.23.2", features = ["v4", "serde"] }
tokio = { version = "1.52.3", features = ["macros"] }
reqwest = {version = "0.13.4", features = ["multipart"] }
strum = { version = "0.28.0", features = ["derive"] }
tauri-plugin-dialog = "2.7.1"
bmp = "0.5.0"
base64 = "0.22.1"
chrono = "0.4.44"
log4rs = "1.4.0"
log = "0.4.30"
human_regex = "0.3.0"
cynic = { version = "3.13.2", features = ["reqwest", "http-reqwest", "serde_json"] }
thiserror = "2.0.18"
itertools = "0.15.0"
argon2 = "0.6.0-rc.8"
machine-uid = "0.6.0"
hex = "0.4.3"

#shared-gen = { version = "0.1.1", registry = "pegn0ly-zanzarah-project-private-crates" }
shared-gen = { path = "../../shared-gen"}
tonic = "0.14.6"
